
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shopsphere-route
  namespace: shopsphere
spec:
  parentRefs:
    - name: shopsphere-gateway
      sectionName: http
    - name: shopsphere-gateway
      sectionName: https
  hostnames:
    - "chethnnn.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-gateway
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 3000
