apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: shopsphere
spec:
  template:
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: elasticsearch
          securityContext:
            runAsUser: 1000
            runAsGroup: 0
